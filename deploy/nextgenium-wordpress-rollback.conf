server {
    listen 80;
    listen [::]:80;
    server_name next-genium.com www.next-genium.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://next-genium.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.next-genium.com;

    ssl_certificate /etc/letsencrypt/live/next-genium.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/next-genium.com/privkey.pem;

    return 301 https://next-genium.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name next-genium.com;

    ssl_certificate /etc/letsencrypt/live/next-genium.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/next-genium.com/privkey.pem;

    client_max_body_size 25m;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass https://77.222.40.254;
        proxy_http_version 1.1;
        proxy_set_header Host next-genium.com;
        proxy_set_header X-Forwarded-Host next-genium.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_ssl_server_name on;
        proxy_ssl_name next-genium.com;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 3;
        proxy_read_timeout 90s;
    }
}
