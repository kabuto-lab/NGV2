server {
    listen 80;
    listen [::]:80;
    server_name nextgenium-preview.46.21.250.147.sslip.io;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name nextgenium-preview.46.21.250.147.sslip.io;

    ssl_certificate /etc/letsencrypt/live/ng-preview-sslip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ng-preview-sslip/privkey.pem;

    root /var/www/nextgenium-preview/current;
    index index.html;
    autoindex off;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;

    location ^~ /api/editor/ {
        client_max_body_size 20m;
        proxy_pass http://127.0.0.1:4341;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    location = /api/careers/short {
        limit_except POST { deny all; }
        client_max_body_size 64k;
        access_log off;
        proxy_pass https://77.222.40.254/en/wp-json/contact-form-7/v1/contact-forms/12/feedback;
        proxy_set_header Host next-genium.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_server_name on;
        proxy_ssl_name next-genium.com;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 3;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    location = /api/careers/full {
        limit_except POST { deny all; }
        client_max_body_size 64k;
        access_log off;
        proxy_pass https://77.222.40.254/en/wp-json/contact-form-7/v1/contact-forms/7782/feedback;
        proxy_set_header Host next-genium.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_server_name on;
        proxy_ssl_name next-genium.com;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 3;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
